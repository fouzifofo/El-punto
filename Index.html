<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>FLAVORA | Commandez en ligne</title>

<style>
:root {
  --red: #e32222;
  --yellow: #ffd21c;
  --bg: #101010;
  --panel: #1c1c1c;
  --muted: #bdbdbd;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: white;
  font-family: Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #111;
  border-bottom: 3px solid var(--yellow);
  text-align: center;
  padding: 15px;
}
.logo {
  color: var(--yellow);
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 2px;
}
.tagline { color: #ddd; margin: 6px 0 12px; }
.lang button {
  padding: 8px 16px;
  border: 0;
  border-radius: 20px;
  margin: 0 3px;
  background: #333;
  color: white;
}
.lang button.active { background: var(--yellow); color: #111; }
.container { width: min(1100px, 100%); margin: auto; padding: 15px; }
.hero {
  background: linear-gradient(120deg,#3b0808,#171717 70%);
  padding: 25px 18px;
  border-radius: 16px;
  margin: 18px 0;
  text-align: center;
}
.hero h1 { color: var(--yellow); margin: 0 0 8px; }
.hero p { color: #eee; margin: 0; line-height: 1.7; }
.category { margin: 30px 0; }
.category h2 {
  color: var(--yellow);
  border-inline-start: 5px solid var(--red);
  padding-inline-start: 12px;
  margin-bottom: 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 16px;
}
.card {
  background: var(--panel);
  border: 1px solid #333;
  border-radius: 14px;
  overflow: hidden;
}
.card img {
  display: block;
  width: 100%;
  height: 175px;
  object-fit: cover;
  background: #292929;
}
.card-body { padding: 14px; }
.card h3 { margin: 0 0 8px; font-size: 19px; }
.desc { color: var(--muted); font-size: 13px; min-height: 18px; }
.price-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 12px;
}
.price { color: var(--yellow); font-weight: bold; }
.add, .size-btn {
  border: 0;
  border-radius: 8px;
  background: var(--red);
  color: white;
  padding: 10px 12px;
  font-weight: bold;
}
.sizes { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.size-btn { background: #303030; border: 1px solid #555; font-size: 13px; }
.size-btn:hover, .add:hover { background: #b91515; }
.cart {
  background: #191919;
  border: 2px solid var(--yellow);
  border-radius: 16px;
  padding: 18px;
  margin: 30px 0;
}
.cart h2 { color: var(--yellow); margin-top: 0; }
.cart-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid #383838;
  padding: 12px 0;
}
.cart-name { flex: 1; min-width: 120px; }
.cart-name small { display: block; color: #bbb; margin-top: 5px; }
.qty { display: flex; align-items: center; gap: 9px; }
.qty button {
  border: 0;
  border-radius: 6px;
  width: 30px;
  height: 30px;
  font-weight: bold;
}
.qty .minus { background: #444; color: white; }
.qty .plus { background: var(--yellow); color: #111; }
.remove { background: #8c1717; color: white; border: 0; border-radius: 6px; padding: 8px; }
.total {
  text-align: center;
  color: var(--yellow);
  font-size: 25px;
  font-weight: bold;
  margin: 20px 0;
}
.form { display: grid; gap: 11px; }
.form input, .form textarea {
  width: 100%;
  border: 1px solid #444;
  background: #252525;
  color: white;
  padding: 13px;
  border-radius: 9px;
}
.form textarea { min-height: 85px; resize: vertical; }
.whatsapp {
  width: 100%;
  padding: 15px;
  background: #20c765;
  color: white;
  border: 0;
  border-radius: 10px;
  font-weight: bold;
  font-size: 17px;
}
.whatsapp:hover { background: #169d4d; }
.empty { color: #aaa; text-align: center; padding: 18px 0; }
footer { text-align: center; color: #888; padding: 25px 10px; }
@media(max-width:500px) {
  .logo { font-size: 27px; }
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
  .card img { height: 125px; }
  .card-body { padding: 10px; }
  .card h3 { font-size: 16px; }
  .size-btn { padding: 8px 7px; font-size: 12px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">FLAVORA</div>
  <div class="tagline" id="tagline">وجبتك المفضلة، على ذوقك</div>
  <div class="lang">
    <button id="arBtn" class="active" onclick="setLanguage('ar')">العربية</button>
    <button id="frBtn" onclick="setLanguage('fr')">Français</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1 id="heroTitle">مرحبا بك في FLAVORA</h1>
    <p id="heroText">اختار وجبتك، زيدها للسلة، وأرسل طلبك مباشرة عبر WhatsApp.</p>
  </section>

  <div id="menu"></div>

  <section class="cart" id="cart">
    <h2 id="cartTitle">🛒 سلة الطلبات</h2>
    <div id="cartItems"></div>
    <div class="total">
      <span id="totalLabel">المجموع:</span>
      <span id="total">0</span> DA
    </div>

    <form class="form" id="orderForm">
      <input id="customerName" autocomplete="name" required
        placeholder="الاسم الكامل">
      <input id="customerPhone" type="tel" autocomplete="tel" required
        placeholder="رقم الهاتف">
      <input id="customerAddress" autocomplete="street-address" required
        placeholder="عنوان التوصيل">
      <textarea id="customerNote" placeholder="ملاحظة إضافية (اختياري)"></textarea>
      <button class="whatsapp" id="sendBtn" type="submit">
        📱 إرسال الطلب عبر WhatsApp
      </button>
    </form>
  </section>
</main>

<footer>FLAVORA © 2026</footer>

<script>
const photo = {
  burger1: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80",
  burger2: "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=700&q=80",
  burger3: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=700&q=80",
  burger4: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?auto=format&fit=crop&w=700&q=80",
  taco1: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=700&q=80",
  taco2: "https://images.unsplash.com/photo-1552332386-f8dd00dc2f85?auto=format&fit=crop&w=700&q=80",
  taco3: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=700&q=80",
  taco4: "https://images.unsplash.com/photo-1624300629298-e9de39c13be5?auto=format&fit=crop&w=700&q=80",
  sandwich1: "https://images.unsplash.com/photo-1553909489-cd47e0907980?auto=format&fit=crop&w=700&q=80",
  sandwich2: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=700&q=80",
  sandwich3: "https://images.unsplash.com/photo-1567234669003-dce7a7a8882b?auto=format&fit=crop&w=700&q=80",
  pizza1: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80",
  pizza2: "https://images.unsplash.com/photo-1594007654729-407eedc4be65?auto=format&fit=crop&w=700&q=80",
  pizza3: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=700&q=80",
  pizza4: "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=700&q=80",
  poutine: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=80",
  gratin1: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?auto=format&fit=crop&w=700&q=80",
  gratin2: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=700&q=80"
};

const menuData = [
  {
    id: "burgers", ar: "🍔 البرغر", fr: "🍔 Burgers",
    items: [
      {id:"burger-classique",ar:"كلاسيك",fr:"Classique",price:200,img:photo.burger1},
      {id:"burger-america",ar:"أمريكا",fr:"America",price:500,img:photo.burger2},
      {id:"burger-forestier",ar:"فورستيير",fr:"Forestier",price:500,img:photo.burger4},
      {id:"burger-crispy",ar:"دجاج مقرمش",fr:"Crispy",price:400,img:photo.burger3},
      {id:"burger-special",ar:"خاص",fr:"Spécial",price:500,img:photo.burger1}
    ]
  },
  {
    id:"tacos", ar:"🌯 التاكوس", fr:"🌯 Tacos",
    items:[
      {id:"t-poulet",ar:"دجاج",fr:"Poulet",img:photo.taco1,sizes:[["M",400],["L",600],["XL",800]]},
      {id:"t-viande",ar:"لحم",fr:"Viande",img:photo.taco2,sizes:[["M",450],["L",700],["XL",800]]},
      {id:"t-merguez",ar:"مرڨاز",fr:"Merguez",img:photo.taco3,sizes:[["M",500],["L",700],["XL",800]]},
      {id:"t-foie",ar:"كبدة",fr:"Foie",img:photo.taco4,sizes:[["M",550],["L",700],["XL",850]]},
      {id:"t-crispy",ar:"مقرمش",fr:"Crispy",img:photo.taco1,sizes:[["M",500],["L",700],["XL",800]]},
      {id:"t-cordon",ar:"كوردون بلو",fr:"Cordon Bleu",img:photo.taco2,sizes:[["M",650],["L",800],["XL",1000]]},
      {id:"t-special",ar:"خاص",fr:"Spécial",img:photo.taco3,sizes:[["M",850],["L",1200],["XL",1500]]}
    ]
  },
  {
    id:"sandwiches", ar:"🥪 السندويتشات", fr:"🥪 Sandwiches",
    items:[
      {id:"s-marine",ar:"ماريني",fr:"Mariné",price:250,img:photo.sandwich1},
      {id:"s-viande",ar:"لحم",fr:"Viande",price:300,img:photo.sandwich2},
      {id:"s-merguez",ar:"مرڨاز",fr:"Merguez",price:300,img:photo.sandwich3},
      {id:"s-foie",ar:"كبدة",fr:"Foie",price:350,img:photo.sandwich1},
      {id:"s-escalope",ar:"إسكالوب",fr:"Escalope",price:350,img:photo.sandwich2},
      {id:"s-special",ar:"خاص",fr:"Spécial",price:500,img:photo.sandwich3}
    ]
  },
  {
    id:"pizza", ar:"🍕 البيتزا", fr:"🍕 Pizza",
    items:[
      {id:"p-margherita",ar:"مارغريتا",fr:"Margherita",img:photo.pizza1,sizes:[["M",350],["L",600],["XL",900]]},
      {id:"p-poulet",ar:"دجاج",fr:"Poulet",img:photo.pizza2,sizes:[["M",400],["L",700],["XL",1000]]},
      {id:"p-viande",ar:"لحم",fr:"Viande",img:photo.pizza3,sizes:[["M",500],["L",850],["XL",1200]]},
      {id:"p-4fromages",ar:"أربعة أجبان",fr:"4 Fromages",img:photo.pizza4,sizes:[["M",600],["L",900],["XL",1500]]},
      {id:"p-special",ar:"خاصة",fr:"Spéciale",img:photo.pizza1,sizes:[["M",800],["L",1400],["XL",2000]]}
    ]
  },
  {
    id:"poutine", ar:"🍟 البوتين", fr:"🍟 Poutine",
    items:[
      {id:"poutine-classique",ar:"بوتين",fr:"Poutine",price:600,img:photo.poutine}
    ]
  },
  {
    id:"gratin", ar:"🧀 الغراتان", fr:"🧀 Gratins",
    items:[
      {id:"g-poulet",ar:"دجاج",fr:"Poulet",price:350,img:photo.gratin1},
      {id:"g-viande",ar:"لحم",fr:"Viande",price:400,img:photo.gratin2},
      {id:"g-merguez",ar:"مرڨاز",fr:"Merguez",price:400,img:photo.gratin1},
      {id:"g-foie",ar:"كبدة",fr:"Foie",price:400,img:photo.gratin2}
    ]
  }
];

let language = "ar";
let cart = [];

function itemName(item) {
  return language === "ar" ? item.ar : item.fr;
}

function money(amount) {
  return amount.toLocaleString("fr-FR") + " DA";
}

function renderMenu() {
  const root = document.getElementById("menu");
  root.innerHTML = "";

  menuData.forEach(category => {
    const section = document.createElement("section");
    section.className = "category";

    const title = document.createElement("h2");
    title.textContent = language === "ar" ? category.ar : category.fr;
    section.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";

    category.items.forEach(item => {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.src = item.img;
      img.alt = itemName(item);
      img.loading = "lazy";
      img.onerror = function() {
        this.style.display = "none";
      };
      card.appendChild(img);

      const body = document.createElement("div");
      body.className = "card-body";

      const h3 = document.createElement("h3");
      h3.textContent = itemName(item);
      body.appendChild(h3);

      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = item.sizes
        ? (language === "ar" ? "اختر الحجم المناسب" : "Choisissez la taille")
        : "";
      body.appendChild(desc);

      if (item.sizes) {
        const sizes = document.createElement("div");
        sizes.className = "sizes";

        item.sizes.forEach(([size, price]) => {
          const btn = document.createElement("button");
          btn.className = "size-btn";
          btn.textContent = size + " — " + money(price);
          btn.type = "button";
          btn.onclick = () => addToCart(
            item.id + "-" + size,
            itemName(item) + " (" + size + ")",
            price
          );
          sizes.appendChild(btn);
        });

        body.appendChild(sizes);
      } else {
        const line = document.createElement("div");
        line.className = "price-line";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = money(item.price);

        const btn = document.createElement("button");
        btn.className = "add";
        btn.type = "button";
        btn.textContent = language === "ar" ? "أضف +" : "Ajouter +";
        btn.onclick = () => addToCart(item.id, itemName(item), item.price);

        line.append(price, btn);
        body.appendChild(line);
      }

      card.appendChild(body);
      grid.appendChild(card);
    });

    section.appendChild(grid);
    root.appendChild(section);
  });
}

function addToCart(id, name, price) {
  const found = cart.find(item => item.id === id);
  if (found) {
    found.qty++;
  } else {
    cart.push({id, name, price, qty:1});
  }
  renderCart();

  const cartSection = document.getElementById("cart");
  cartSection.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function changeQty(id, amount) {
  const item = cart.find(entry => entry.id === id);
  if (!item) return;
  item.qty += amount;
  if (item.qty <= 0) {
    cart = cart.filter(entry => entry.id !== id);
  }
  renderCart();
}

function deleteItem(id) {
  cart = cart.filter(item => item.id !== id);
  renderCart();
}

function renderCart() {
  const root = document.getElementById("cartItems");
  root.innerHTML = "";

  if (cart.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = language === "ar" ? "السلة فارغة" : "Le panier est vide";
    root.appendChild(empty);
  }

  cart.forEach(item => {
    const row = document.createElement("div");
    row.className = "cart-row";

    const name = document.createElement("div");
    name.className = "cart-name";

    const strong = document.createElement("strong");
    strong.textContent = item.name;

    const small = document.createElement("small");
    small.textContent = money(item.price * item.qty);

    name.append(strong, small);

    const qty = document.createElement("div");
    qty.className = "qty";

    const minus = document.createElement("button");
    minus.className = "minus";
    minus.textContent = "−";
    minus.type = "button";
    minus.setAttribute("aria-label", "Decrease quantity");
    minus.onclick = () => changeQty(item.id, -1);

    const count = document.createElement("span");
    count.textContent = item.qty;

    const plus = document.createElement("button");
    plus.className = "plus";
    plus.textContent = "+";
    plus.type = "button";
    plus.setAttribute("aria-label", "Increase quantity");
    plus.onclick = () => changeQty(item.id, 1);

    qty.append(minus, count, plus);

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.type = "button";
    remove.textContent = language === "ar" ? "حذف" : "Retirer";
    remove.onclick = () => deleteItem(item.id);

    row.append(name, qty, remove);
    root.appendChild(row);
  });

  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  document.getElementById("total").textContent =
    total.toLocaleString("fr-FR");
}

function setLanguage(lang) {
  language = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  document.getElementById("arBtn").classList.toggle("active", lang === "ar");
  document.getElementById("frBtn").classList.toggle("active", lang === "fr");

  document.getElementById("tagline").textContent = lang === "ar"
    ? "وجبتك المفضلة، على ذوقك"
    : "Vos plats préférés, à votre goût";

  document.getElementById("heroTitle").textContent = lang === "ar"
    ? "مرحبا بك في FLAVORA"
    : "Bienvenue chez FLAVORA";

  document.getElementById("heroText").textContent = lang === "ar"
    ? "اختار وجبتك، زيدها للسلة، وأرسل طلبك مباشرة عبر WhatsApp."
    : "Choisissez vos plats, ajoutez-les au panier et commandez sur WhatsApp.";

  document.getElementById("cartTitle").textContent = lang === "ar"
    ? "🛒 سلة الطلبات"
    : "🛒 Votre panier";

  document.getElementById("totalLabel").textContent = lang === "ar"
    ? "المجموع:"
    : "Total :";

  document.getElementById("customerName").placeholder = lang === "ar"
    ? "الاسم الكامل"
    : "Nom complet";

  document.getElementById("customerPhone").placeholder = lang === "ar"
    ? "رقم الهاتف"
    : "Numéro de téléphone";

  document.getElementById("customerAddress").placeholder = lang === "ar"
    ? "عنوان التوصيل"
    : "Adresse de livraison";

  document.getElementById("customerNote").placeholder = lang === "ar"
    ? "ملاحظة إضافية (اختياري)"
    : "Note supplémentaire (facultatif)";

  document.getElementById("sendBtn").textContent = lang === "ar"
    ? "📱 إرسال الطلب عبر WhatsApp"
    : "📱 Envoyer la commande par WhatsApp";

  renderMenu();
  renderCart();
}

document.getElementById("orderForm").addEventListener("submit", function(event) {
  event.preventDefault();

  if (cart.length === 0) {
    alert(language === "ar"
      ? "أضف صنفًا إلى السلة أولاً."
      : "Ajoutez d'abord un article au panier.");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();
  const note = document.getElementById("customerNote").value.trim();

  if (!name || !phone || !address) {
    alert(language === "ar"
      ? "أدخل الاسم ورقم الهاتف والعنوان."
      : "Saisissez le nom, le téléphone et l'adresse.");
    return;
  }

  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

  let message = language === "ar"
    ? "🍔 FLAVORA - طلب جديد\n\n"
    : "🍔 FLAVORA - NOUVELLE COMMANDE\n\n";

  message += (language === "ar" ? "الاسم: " : "Nom : ") + name + "\n";
  message += (language === "ar" ? "الهاتف: " : "Téléphone : ") + phone + "\n";
  message += (language === "ar" ? "العنوان: " : "Adresse : ") + address + "\n";

  if (note) {
    message += (language === "ar" ? "ملاحظة: " : "Note : ") + note + "\n";
  }

  message += "\n" + (language === "ar" ? "الطلب:" : "Commande :") + "\n";

  cart.forEach(item => {
    message += "• " + item.name + " × " + item.qty +
      " = " + (item.price * item.qty) + " DA\n";
  });

  message += "\n" + (language === "ar" ? "المجموع: " : "Total : ") +
    total + " DA";

  const whatsappNumber = "213696086599";
  const url = "https://wa.me/" + whatsappNumber +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank", "noopener");
});

renderMenu();
renderCart();
</script>
</body>
</html>
